[defaults]
inventory = inventory/production.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Convenção deste projeto: a chave dedicada de automação (gerada durante o
# bootstrap, pública injetada em todo LXC via ssh_public_keys do Terraform)
# fica em ~/.ssh/papermoon_platform no control node (o próprio Proxmox, na
# prática — ver docs/terraform.md).
private_key_file = ~/.ssh/papermoon_platform

; Descomente quando a Fase 3b criar segredos com ansible-vault
; (arquivo .vault_pass fica fora do Git — ver .gitignore na raiz).
; vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
