[defaults]
inventory = inventory/production.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

; Descomente quando a Fase 3b criar segredos com ansible-vault
; (arquivo .vault_pass fica fora do Git — ver .gitignore na raiz).
; vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
