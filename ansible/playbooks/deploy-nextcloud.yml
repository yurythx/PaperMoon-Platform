---
- name: Deploy Nextcloud
  hosts: nextcloud
  roles:
    - role: docker_app
      vars:
        docker_app_name: nextcloud
        docker_app_compose_src: "{{ playbook_dir }}/../../docker/nextcloud/docker-compose.yml"
        docker_app_env:
          MYSQL_HOST: "{{ nextcloud_mysql_host }}"
          MYSQL_DATABASE: "{{ nextcloud_mysql_database }}"
          MYSQL_USER: "{{ nextcloud_mysql_user }}"
          MYSQL_PASSWORD: "{{ nextcloud_mysql_password }}"
          REDIS_HOST: "{{ nextcloud_redis_host }}"
          REDIS_HOST_PASSWORD: "{{ nextcloud_redis_password }}"
          NEXTCLOUD_TRUSTED_DOMAINS: "{{ nextcloud_trusted_domains }}"
          NEXTCLOUD_ADMIN_USER: "{{ nextcloud_admin_user }}"
          NEXTCLOUD_ADMIN_PASSWORD: "{{ nextcloud_admin_password }}"
          PHP_MEMORY_LIMIT: "512M"
          PHP_UPLOAD_LIMIT: "1G"

  tasks:
    # Nextcloud recomenda cron.php em vez do modo AJAX para tarefas de fundo
    # (mais confiável, não depende de visitas ao site para disparar).
    - name: Agendar cron.php do Nextcloud a cada 5 minutos
      ansible.builtin.cron:
        name: "nextcloud cron"
        minute: "*/5"
        user: "{{ support_user }}"
        job: "docker exec -u www-data nextcloud php cron.php"

    # NEXTCLOUD_TRUSTED_DOMAINS só é lido pelo entrypoint da imagem oficial
    # na primeira instalação (quando config.php ainda não existe) — numa
    # instância já instalada, mudar o env var e reiniciar o container não
    # atualiza trusted_domains. Achado ao investigar "acessar através de um
    # domínio inseguro" com o Nextcloud já em produção: precisa do occ.
    - name: Verificar trusted_domains atual
      ansible.builtin.command: docker exec -u www-data nextcloud php occ config:system:get trusted_domains
      register: nc_trusted_domains
      changed_when: false

    # Nextcloud sempre inclui "localhost" no índice 0 por conta própria (nunca
    # veio do nosso env var) — por isso o índice de destino é calculado pela
    # contagem atual de entradas, não por uma posição fixa, senão sobrescreve
    # um domínio já existente em vez de acrescentar.
    - name: Determinar domínios ainda ausentes
      ansible.builtin.set_fact:
        nc_missing_domains: "{{ nextcloud_trusted_domains.split(' ') | difference(nc_trusted_domains.stdout_lines) }}"

    - name: Adicionar domínios ausentes ao trusted_domains (occ) — pós-instalação
      ansible.builtin.command: >-
        docker exec -u www-data nextcloud php occ config:system:set
        trusted_domains {{ nc_trusted_domains.stdout_lines | length + idx }} --value={{ item }}
      loop: "{{ nc_missing_domains }}"
      loop_control:
        index_var: idx
