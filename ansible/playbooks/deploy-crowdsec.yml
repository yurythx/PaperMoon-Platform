---
# A ponte journald -> rsyslog (imjournal) que este host precisa pro
# acquis.yaml funcionar agora vive na role "common" (roda pra todo
# docker_host via site.yml) — generalizada na Fase 2, quando os outros
# hosts passaram a depender do mesmo auth.log pros bouncers.
- name: Deploy CrowdSec
  hosts: crowdsec
  roles:
    - role: docker_app
      vars:
        docker_app_name: crowdsec
        docker_app_compose_src: "{{ playbook_dir }}/../../docker/crowdsec/docker-compose.yml"
        docker_app_env:
          TZ: "{{ system_timezone }}"
          COLLECTIONS: "{{ crowdsec_collections }}"
        docker_app_extra_files:
          - src: "{{ playbook_dir }}/../../docker/crowdsec/acquis.yaml"
            dest: "acquis.yaml"
