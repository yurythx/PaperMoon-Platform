---
# Deploy 100% declarativo do PaperMoon — sem depender do deploy.sh do
# próprio app. Cada etapa é uma task Ansible idempotente. O ciclo de vida do
# Docker Compose usa `docker compose` via ansible.builtin.command
# consistentemente em todas as etapas (não só nos comandos pontuais de
# management do Django) — não é um script solto no servidor, é uma
# sequência de tasks versionada aqui no repo, mas evita misturar o módulo
# community.docker.docker_compose_v2 com chamadas diretas ao CLI: na
# prática, esse módulo se confundiu ("No such image") ao inspecionar o
# estado do projeto logo depois de um build feito fora dele — problema real
# encontrado rodando isto de verdade contra o host, não hipotético.
#
# Sequência (mesma ordem segura do deploy.sh original, só que via Ansible):
#   git pull -> build das imagens -> chaves JWT (1x) -> sobe banco/cache ->
#   migrate -> collectstatic -> sobe o resto -> limpa imagens órfãs.
- name: Deploy PaperMoon
  hosts: papermoon
  vars:
    papermoon_dir: /opt/docker/papermoon
    papermoon_compose_file: docker-compose.prod.yml
    papermoon_env_file: .env.production
    papermoon_compose_cmd: >-
      docker compose -f {{ papermoon_compose_file }} --env-file {{ papermoon_env_file }}

  tasks:
    - name: Instalar git (necessário para o módulo git)
      ansible.builtin.apt:
        name: git
        state: present

    # /opt é raiz-only; sem isso o clone (rodando como suporte) falha.
    - name: Garantir /opt/docker
      ansible.builtin.file:
        path: /opt/docker
        state: directory
        mode: "0755"

    - name: Garantir {{ papermoon_dir }}, já pertencendo ao suporte
      ansible.builtin.file:
        path: "{{ papermoon_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ support_user }}"
        group: "{{ support_user }}"

    - name: Atualizar o repositório do PaperMoon (git pull idempotente)
      ansible.builtin.git:
        repo: "https://github.com/yurythx/papermoon.git"
        dest: "{{ papermoon_dir }}"
        version: main
        force: false
      become_user: "{{ support_user }}"
      register: papermoon_git

    - name: Verificar se .env.production já existe
      ansible.builtin.stat:
        path: "{{ papermoon_dir }}/.env.production"
      register: papermoon_env_stat

    - name: Gerar .env.production (só na primeira vez)
      ansible.builtin.template:
        src: templates/papermoon-env-production.j2
        dest: "{{ papermoon_dir }}/.env.production"
        mode: "0600"
        owner: "{{ support_user }}"
        group: "{{ support_user }}"
      when: not papermoon_env_stat.stat.exists

    # A geração acima só roda na 1ª vez (não sobrescreve o que o deploy.sh do
    # próprio app grava depois, ex: chaves JWT). Isso significa que se
    # host_vars/papermoon.yml mudar (ex: domínio real chegou depois do
    # primeiro apply), o arquivo já existente nunca via de novo o valor
    # atualizado — foi exatamente o que aconteceu aqui: o vault já tinha
    # "https://papermoon.cloud" há tempo, mas o .env.production ao vivo
    # ainda apontava pro IP da LAN, quebrando o redirect_uri do SSO (Keycloak
    # tentava devolver o browser pra um IP privado inalcançável de fora).
    # Estas linhas fecham esse gap de vez: alinham as chaves críticas de
    # domínio/segurança a cada deploy, existindo o arquivo ou não.
    - name: Alinhar domínio/segurança em .env.production com host_vars (idempotente)
      ansible.builtin.lineinfile:
        path: "{{ papermoon_dir }}/.env.production"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: "ALLOWED_HOSTS", value: "{{ papermoon_allowed_hosts }}" }
        - { key: "CORS_ALLOWED_ORIGINS", value: "{{ papermoon_cors_allowed_origins }}" }
        - { key: "FRONTEND_URL", value: "{{ papermoon_frontend_url }}" }
        - { key: "NEXT_PUBLIC_SITE_URL", value: "{{ papermoon_frontend_url }}" }
        - { key: "SECURE_COOKIES", value: "{{ papermoon_secure_cookies | default('false') }}" }
      loop_control:
        label: "{{ item.key }}"

    - name: Construir as imagens (backend + frontend)
      ansible.builtin.command:
        cmd: "{{ papermoon_compose_cmd }} build --parallel"
        chdir: "{{ papermoon_dir }}"
      become_user: "{{ support_user }}"
      changed_when: true

    - name: Verificar se as chaves JWT RS256 já estão configuradas
      ansible.builtin.command:
        cmd: grep -qE '^JWT_PRIVATE_KEY=.+' .env.production
        chdir: "{{ papermoon_dir }}"
      register: papermoon_jwt_check
      changed_when: false
      failed_when: false

    - name: Gerar e gravar as chaves JWT RS256 (só se ausentes)
      when: papermoon_jwt_check.rc != 0
      become_user: "{{ support_user }}"
      block:
        - name: Rodar generate_jwt_keys
          ansible.builtin.command:
            cmd: >-
              {{ papermoon_compose_cmd }} run --rm --no-deps
              -e DJANGO_SETTINGS_MODULE=core.settings.local
              django-api python manage.py generate_jwt_keys
            chdir: "{{ papermoon_dir }}"
          register: papermoon_jwt_output
          changed_when: true

        - name: Gravar JWT_PRIVATE_KEY em .env.production
          ansible.builtin.lineinfile:
            path: "{{ papermoon_dir }}/.env.production"
            regexp: "^JWT_PRIVATE_KEY="
            line: "{{ papermoon_jwt_output.stdout_lines | select('match', '^JWT_PRIVATE_KEY=') | first }}"

        - name: Gravar JWT_PUBLIC_KEY em .env.production
          ansible.builtin.lineinfile:
            path: "{{ papermoon_dir }}/.env.production"
            regexp: "^JWT_PUBLIC_KEY="
            line: "{{ papermoon_jwt_output.stdout_lines | select('match', '^JWT_PUBLIC_KEY=') | first }}"

    - name: Subir Postgres e Redis, aguardando ficarem saudáveis
      ansible.builtin.command:
        cmd: "{{ papermoon_compose_cmd }} up -d --wait --wait-timeout 120 postgres redis"
        chdir: "{{ papermoon_dir }}"
      become_user: "{{ support_user }}"
      changed_when: true

    - name: Rodar migrations do Django
      ansible.builtin.command:
        cmd: >-
          {{ papermoon_compose_cmd }} run --rm --no-deps
          -e DJANGO_SETTINGS_MODULE=core.settings.production
          django-api python manage.py migrate --noinput
        chdir: "{{ papermoon_dir }}"
      become_user: "{{ support_user }}"
      changed_when: true

    - name: Coletar arquivos estáticos do Django
      ansible.builtin.command:
        cmd: >-
          {{ papermoon_compose_cmd }} run --rm --no-deps
          -e DJANGO_SETTINGS_MODULE=core.settings.production
          django-api python manage.py collectstatic --noinput --clear
        chdir: "{{ papermoon_dir }}"
      become_user: "{{ support_user }}"
      changed_when: true

    - name: Subir a stack completa (API, worker, beat, flower, frontend)
      ansible.builtin.command:
        cmd: "{{ papermoon_compose_cmd }} up -d --wait --wait-timeout 180 --remove-orphans"
        chdir: "{{ papermoon_dir }}"
      become_user: "{{ support_user }}"
      changed_when: true
      register: papermoon_up

    - name: Verificar saúde do backend (/health/)
      ansible.builtin.uri:
        url: "http://localhost:8000/health/"
        headers:
          Host: django-api
        status_code: 200
      register: papermoon_health
      retries: 10
      delay: 6
      until: papermoon_health.status == 200

    # --volumes NUNCA aqui — apagaria dados de containers já removidos
    # (ex: um volume órfão de um serviço renomeado), não é isso que
    # "limpeza segura" significa.
    - name: Limpar imagens Docker órfãs (sem tocar em volumes)
      ansible.builtin.command:
        cmd: docker image prune -f --filter "until=72h"
      changed_when: true

    - name: Status final dos containers
      ansible.builtin.command:
        cmd: "{{ papermoon_compose_cmd }} ps"
        chdir: "{{ papermoon_dir }}"
      become_user: "{{ support_user }}"
      changed_when: false
      register: papermoon_status

    - name: Resumo do deploy
      ansible.builtin.debug:
        msg:
          - "Commit atualizado: {{ papermoon_git.before | default('N/A') }} -> {{ papermoon_git.after }}"
          - "Health check: {{ papermoon_health.status }}"
          - "{{ papermoon_status.stdout_lines }}"
