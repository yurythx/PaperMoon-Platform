---
# Reversão da Fase 2 do CrowdSec — rodar em TODOS os hosts com bouncer
# instalado ANTES de destruir a LXC do engine central (132) no Terraform.
# Exclui crowdsec (132) e uptime-kuma (141) do próprio grupo de destino
# porque as duas LXCs serão destruídas por completo em seguida — não faz
# sentido desinstalar o bouncer de um host que vai deixar de existir.
#
# Uso único (decomissionamento do CrowdSec) — depois de rodado e verificado,
# este playbook e o role crowdsec_bouncer são removidos do repositório junto
# com o resto do CrowdSec (ver docs/docker.md).
- name: Remover CrowdSec firewall bouncer de todos os hosts (exceto os que serão destruídos)
  hosts: "crowdsec_bounced_hosts:!crowdsec:!uptime-kuma"
  tasks:
    - name: Executar tasks de desinstalação do role crowdsec_bouncer
      ansible.builtin.include_role:
        name: crowdsec_bouncer
        tasks_from: uninstall
