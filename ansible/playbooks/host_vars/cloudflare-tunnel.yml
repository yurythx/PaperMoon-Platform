---
# Túnel remotely-managed (criado no painel Zero Trust da Cloudflare) — o
# ingress (quais hostnames apontam pra qual serviço interno) é configurado
# lá no painel, em "Public Hostname", não neste repositório. Ver README.md.
#
# PLACEHOLDER — cole o token real (painel Cloudflare > Zero Trust > Networks
# > Tunnels > seu túnel > "Install connector" > comando `cloudflared tunnel
# run --token ...`, é o valor depois de --token) e criptografe:
#   ansible-vault encrypt host_vars/cloudflare-tunnel.yml
cloudflare_tunnel_token: "CHANGE_ME_TUNNEL_TOKEN"

# cloudflared só faz conexões de saída — nenhuma porta de entrada necessária.
firewall_allowed_ports: []
