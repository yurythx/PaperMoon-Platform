---
- name: Deploy qBittorrent
  hosts: qbittorrent
  roles:
    - role: docker_app
      vars:
        docker_app_name: qbittorrent
        docker_app_compose_src: "{{ playbook_dir }}/../../docker/qbittorrent/docker-compose.yml"
        docker_app_env:
          PUID: "{{ qbittorrent_puid }}"
          PGID: "{{ qbittorrent_pgid }}"
          TZ: "{{ system_timezone }}"
          WEBUI_PORT: "{{ qbittorrent_webui_port }}"
