---
- name: Deploy Navidrome
  hosts: navidrome
  roles:
    - role: docker_app
      vars:
        docker_app_name: navidrome
        docker_app_compose_src: "{{ playbook_dir }}/../../docker/navidrome/docker-compose.yml"
        docker_app_env:
          TZ: "{{ timezone }}"
          ND_SCANSCHEDULE: "{{ navidrome_scan_schedule }}"
          ND_LOGLEVEL: "{{ navidrome_log_level }}"
