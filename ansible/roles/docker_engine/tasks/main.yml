---
# Segue o método oficial de instalação do Docker via apt repo
# (https://docs.docker.com/engine/install/ubuntu/), adaptado para Ansible.

- name: Criar diretório de keyrings do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar a chave GPG oficial do Docker
  ansible.builtin.get_url:
    url: "{{ docker_apt_repo_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Adicionar o repositório apt do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc] {{ docker_apt_repo_url }}
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Instalar Docker Engine e Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Adicionar usuário de suporte ao grupo docker
  ansible.builtin.user:
    name: "{{ support_user }}"
    groups: docker
    append: true

- name: Garantir que o serviço docker está ativo e habilitado no boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
