---
- name: Atualizar cache do apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Atualizar pacotes do sistema
  ansible.builtin.apt:
    upgrade: safe

- name: Instalar pacotes base
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - htop
      - ufw
      - ca-certificates
      - unattended-upgrades
      - rsyslog
    state: present

# Achado implantando o CrowdSec (CT 132): neste template Ubuntu 24.04,
# sshd loga direto no journald (detecta systemd), nunca passa pelo socket
# clássico de syslog que o rsyslog (imuxsock) escuta — auth.log fica parado
# pra sempre sem isso, mesmo com a regra "auth,authpriv.* -> auth.log"
# correta em 50-default.conf. Generalizado pra cá (era só do host do
# crowdsec) porque qualquer bouncer/agente da Fase 2 do CrowdSec nos outros
# hosts também depende de auth.log estar vivo.
- name: Habilitar ponte journald -> rsyslog (imjournal) — auth.log fica parado sem isso
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/70-imjournal.conf
    content: |
      module(load="imjournal" StateFile="imjournal.state")
    mode: "0644"
  notify: Reiniciar rsyslog

# community.general.timezone quebra em ansible-core 2.19 ("Finalization of
# task args ... is undefined"). Um 'when' comparando um valor registrado com
# uma group_var também quebrou do mesmo jeito ("is undefined" mesmo com a
# var definida e confirmada via debug) — parece um bug real de
# ansible-core 2.19 na resolução de 'when' nesse cenário específico, não
# algo que valha a pena investigar mais fundo aqui. 'timedatectl' sozinho,
# sem condicional, já é idempotente no nível do SO (rodar de novo com o
# mesmo valor não tem efeito colateral).
- name: Definir timezone
  ansible.builtin.command: "timedatectl set-timezone {{ system_timezone }}"
  changed_when: false

# --- Atualizações automáticas de segurança (Fase 4) ---
# Patches de segurança são aplicados sozinhos; reboot (raro — só
# kernel/glibc) fica pendente até rodar manualmente, para nunca reiniciar um
# host sem aviso. Confirmado com o usuário.
- name: Habilitar atualização automática de segurança, sem reboot automático
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51papermoon-platform-unattended-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: Garantir que o serviço unattended-upgrades está ativo
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

# Senha real (não só chave SSH) — usada exclusivamente pelo Console do
# Proxmox (getty local dentro do LXC), já que SSH continua key-only
# (PasswordAuthentication no, abaixo). Sem isso, root e suporte ficam com
# a conta bloqueada ("passwd -S" mostra "L") e ninguém consegue logar pelo
# Console em caso de a chave SSH não estar à mão.
- name: Criar usuário de suporte (com senha real, pro Console do Proxmox)
  ansible.builtin.user:
    name: "{{ support_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    password: "{{ support_user_password_hash }}"

- name: Autorizar chaves SSH para o usuário de suporte
  ansible.posix.authorized_key:
    user: "{{ support_user }}"
    key: "{{ item }}"
  loop: "{{ ssh_public_keys }}"

- name: Permitir sudo sem senha para o usuário de suporte (necessário para automação sem TTY)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ support_user }}"
    content: "{{ support_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

# --- Endurecimento de SSH ---
# Roda por último e só depois que o usuário de suporte já tem sudo + chave
# funcionando, para nunca ficar sem forma de acessar o host.
- name: Desabilitar autenticação por senha via SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  when: harden_ssh | bool
  notify: Reiniciar ssh

- name: Desabilitar login root via SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  when: harden_ssh | bool
  notify: Reiniciar ssh
