---
# Role genérica: sobe QUALQUER stack docker/<app>/ deste monorepo. Não sabe
# nada sobre a aplicação em si — recebe tudo por variável do playbook que a
# inclui (ver playbooks/deploy-<app>.yml, criado na Fase 3b).
#
# Variáveis esperadas:
#   docker_app_name         (ex: "jellyfin")
#   docker_app_compose_src  (caminho local, no controlador, do docker-compose.yml)
#   docker_app_dir          (default: /opt/docker/<docker_app_name>)
#   docker_app_env          (dict de variáveis -> vira o .env da stack)
#   docker_app_extra_files  (lista de {src, dest, template} — arquivos/pastas
#                            extras além de compose+.env, ex: prometheus.yml,
#                            provisioning/ do Grafana, ou config.yml.j2 do
#                            cloudflared. 'dest' é relativo a docker_app_dir.
#                            'template: true' renderiza como Jinja2 (module
#                            template) em vez de copiar como está (copy).

- name: Definir diretório padrão da stack, se não sobrescrito
  ansible.builtin.set_fact:
    docker_app_dir: "{{ docker_app_dir | default('/opt/docker/' + docker_app_name) }}"

# Garantido explicitamente porque o Ansible só aplica o 'mode' pedido ao
# diretório-folha — se /opt/docker precisar ser criado implicitamente como
# pai (primeira stack de cada host), ele herda permissão default (0750 no
# umask deste sistema), não o 0755 que os containers bind-montados exigem
# pra sequer atravessar o path. Descoberto com o Prometheus crash-loopando
# em "permission denied" mesmo com prometheus.yml já em 0644.
- name: Garantir permissão de travessia em /opt/docker
  ansible.builtin.file:
    path: /opt/docker
    state: directory
    mode: "0755"

- name: Criar diretório da stack
  ansible.builtin.file:
    path: "{{ docker_app_dir }}"
    state: directory
    # 0755, não 0750: qualquer arquivo aqui dentro bind-montado num container
    # (docker_app_extra_files) precisa ser alcançável pelo UID do processo
    # containerizado, que quase nunca é "suporte" nem root — sem 'x' pra
    # "outros" no diretório, o container nem consegue atravessar o path.
    mode: "0755"
    owner: "{{ support_user }}"
    group: "{{ support_user }}"

- name: Copiar docker-compose.yml
  ansible.builtin.copy:
    src: "{{ docker_app_compose_src }}"
    dest: "{{ docker_app_dir }}/docker-compose.yml"
    mode: "0640"

# Sem isso, TODO re-run do Ansible (site.yml de manutenção, patch de SO, etc.)
# regenerava o .env incondicionalmente a partir de docker_app_env — inofensivo
# enquanto o host_vars correspondente guarda o segredo real, mas catastrófico
# se ele algum dia voltar a "CHANGE_ME" (reset de git, clone novo do
# controlador): o próximo run sobrescreveria o .env de produção com lixo e
# reiniciaria o container quebrado, silenciosamente. Gerar só na primeira vez
# (mesmo padrão já usado pelo .env.production do papermoon) elimina esse
# raio de explosão — trocar um segredo de propósito exige apagar o .env do
# host manualmente antes de rodar de novo, ou usar
# `docker_app_force_env_regen: true` pontualmente.
- name: Verificar se o .env da stack já existe
  ansible.builtin.stat:
    path: "{{ docker_app_dir }}/.env"
  register: docker_app_env_stat

- name: Gerar .env da stack (só na primeira vez)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ docker_app_dir }}/.env"
    mode: "0600"
  when: not docker_app_env_stat.stat.exists or (docker_app_force_env_regen | default(false))

# Achado implantando o Homepage: 'copy'/'template' não criam o diretório
# pai do destino sozinhos — só funcionava até agora porque todo
# docker_app_extra_files anterior tinha 'dest' direto na raiz de
# docker_app_dir (ex: "prometheus.yml"). O primeiro 'dest' com subpasta
# (ex: "config/settings.yaml") falhou com "Destination directory ...
# does not exist". Generalizado aqui em vez de corrigido só no playbook
# do Homepage, pra qualquer stack futuro com subpasta já funcionar.
- name: Garantir que os diretórios pai dos arquivos extras existem
  ansible.builtin.file:
    path: "{{ docker_app_dir }}/{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
    owner: "{{ support_user }}"
    group: "{{ support_user }}"
  loop: "{{ docker_app_extra_files }}"
  when: (item.dest | dirname) != '.'

# 0644 (não 0640): estes arquivos são bind-montados DENTRO de containers cujo
# processo roda com um UID interno qualquer (ex: prometheus roda como uid
# 65534 "nobody") — sem leitura pra "outros" no arquivo, o container recebe
# "permission denied" ao tentar ler, mesmo com o diretório acessível.
- name: Copiar arquivos/pastas de configuração extras (estáticos)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ docker_app_dir }}/{{ item.dest }}"
    mode: "0644"
  loop: "{{ docker_app_extra_files }}"
  when: not (item.template | default(false))

- name: Renderizar arquivos de configuração extras (Jinja2)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ docker_app_dir }}/{{ item.dest }}"
    mode: "0644"
  loop: "{{ docker_app_extra_files }}"
  when: item.template | default(false)

# Sempre roda (não só quando o compose/.env muda) — o próprio módulo
# docker_compose_v2 já é idempotente e só recria containers cujo config mudou.
- name: Subir/atualizar a stack via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ docker_app_dir }}"
    pull: always
    state: present
