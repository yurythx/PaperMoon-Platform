---
# Reversão da Fase 2 — usada ao decomissionar o CrowdSec (CT 132) por
# completo. Rodar em TODOS os hosts com bouncer instalado ANTES de destruir
# a LXC do engine central no Terraform — senão o serviço fica em loop de
# retry tentando falar com um LAPI que não responde mais (não vaza pra fora,
# mas é sujeira desnecessária e atrasa qualquer diagnóstico futuro).
# Ver ansible/playbooks/remove-crowdsec-bouncer.yml pelo playbook que chama isto.

- name: Verificar se o bouncer está instalado
  ansible.builtin.stat:
    path: /usr/local/bin/crowdsec-firewall-bouncer
  register: bouncer_bin

# Parar o serviço já limpa as regras de iptables que ele próprio inseriu
# (o binário registra um handler de cleanup no shutdown) — não precisamos
# mexer em iptables na mão aqui.
- name: Parar e desabilitar o serviço
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    state: stopped
    enabled: false
  when: bouncer_bin.stat.exists
  failed_when: false # host pode já estar sem o serviço rodando; não é motivo pra falhar

- name: Remover binário
  ansible.builtin.file:
    path: /usr/local/bin/crowdsec-firewall-bouncer
    state: absent

- name: Remover unit systemd
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec-firewall-bouncer.service
    state: absent

- name: Remover diretório de configuração (api_url/api_key)
  ansible.builtin.file:
    path: /etc/crowdsec/bouncers
    state: absent

- name: Recarregar o systemd daemon (unit sumiu do disco)
  ansible.builtin.systemd:
    daemon_reload: true
