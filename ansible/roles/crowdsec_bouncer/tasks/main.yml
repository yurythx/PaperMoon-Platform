---
# Fase 2 do CrowdSec (ver docker/crowdsec/README.md) — só o bouncer, sem
# agente local: este host não precisa detectar nada sozinho, só aplicar via
# iptables as decisões já tomadas pelo engine central (CT 132), incluindo a
# blocklist coletiva da comunidade CrowdSec que ele já puxa. Ganho real com
# instalação mínima em cada host.
#
# Variáveis esperadas:
#   crowdsec_bouncer_api_key  (gerada 1x por host via
#                              `cscli bouncers add <hostname>` no CT 132 —
#                              não existe forma de recuperar depois de
#                              gerada, só revogar e gerar outra)

- name: Verificar se o crowdsec-firewall-bouncer já está instalado
  ansible.builtin.stat:
    path: /usr/local/bin/crowdsec-firewall-bouncer
  register: bouncer_bin

# install.sh pergunta "nftables ou iptables?" sempre que os dois binários
# existem no host (é o nosso caso — Ubuntu 24.04 traz "iptables" como shim
# de compat sobre nftables) e, se a resposta for "iptables", pergunta de
# novo se quer instalar o "ipset" (também ausente por padrão). Sem
# responder as duas, o script trava esperando input pra sempre debaixo do
# Ansible (sem TTY) — achado ao rodar pela primeira vez (comando ficou
# preso >3min). Pré-instalar ipset aqui elimina a segunda pergunta; a
# primeira é respondida via 'stdin' do módulo command.
- name: Garantir ipset instalado (evita 2ª pergunta interativa do install.sh)
  ansible.builtin.apt:
    name: ipset
    state: present
  when: not bouncer_bin.stat.exists

- name: Baixar o tarball do crowdsec-firewall-bouncer
  ansible.builtin.get_url:
    url: "https://github.com/crowdsecurity/cs-firewall-bouncer/releases/download/v{{ crowdsec_bouncer_version }}/crowdsec-firewall-bouncer-linux-amd64.tgz"
    dest: /tmp/crowdsec-firewall-bouncer.tgz
    mode: "0644"
  when: not bouncer_bin.stat.exists

- name: Extrair o tarball
  ansible.builtin.unarchive:
    src: /tmp/crowdsec-firewall-bouncer.tgz
    dest: /tmp
    remote_src: true
  when: not bouncer_bin.stat.exists

# O install.sh do próprio pacote cria usuário/systemd unit/config default —
# reaproveitar em vez de reescrever isso à mão aqui. 'stdin' responde a
# pergunta "nftables (default) ou iptables?" (ver comentário acima).
- name: Rodar o instalador oficial (cria unit systemd + config default)
  ansible.builtin.command: ./install.sh
  args:
    chdir: /tmp/crowdsec-firewall-bouncer-v{{ crowdsec_bouncer_version }}
    stdin: "iptables\n"
  when: not bouncer_bin.stat.exists

- name: Configurar api_url/api_key (aponta pro LAPI central, CT 132)
  ansible.builtin.template:
    src: crowdsec-firewall-bouncer.yaml.j2
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    mode: "0600"
  notify: Reiniciar crowdsec-firewall-bouncer

- name: Garantir que o serviço está ativo
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    enabled: true
    state: started
