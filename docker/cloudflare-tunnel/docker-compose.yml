services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    # Túnel remotely-managed (criado no painel Zero Trust, não via
    # `cloudflared tunnel create`) — ingress/hostnames vivem no painel
    # Cloudflare, não em config.yml local. Ver README.md.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
