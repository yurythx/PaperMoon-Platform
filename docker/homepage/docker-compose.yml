services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      # Obrigatório em versões recentes — sem isso a imagem responde 500
      # pra qualquer Host header que não esteja na lista (proteção contra
      # DNS rebinding). Cobre acesso via IP direto e via domínio público.
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - ./config:/app/config
    ports:
      - "3000:3000"
